version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: "monday"
      time: "02:00"
      timezone: "UTC"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: "monday"
      time: "02:00"
      timezone: "UTC"
    groups:
      production:
        dependency-type: production
      development:
        dependency-type: development
    ignore:
      # tsup 8.5.1 inlines rollup-plugin-dts 6.1.1, whose dts pipeline needs the
      # legacy TypeScript JS compiler API (ts.sys) that only exists in 5.x.
      # typescript 6.x/7.x break `pnpm build`; revisit when tsup ships a
      # TS7-compatible dts pipeline.
      - dependency-name: typescript
        versions: [">=6"]
      # tsup 9 requires an ESM-only dependency chain (cac) that breaks the
      # Node 18 leg of the test matrix with ERR_REQUIRE_ESM, and vite 8
      # dropped Node 18 as well. Hold both on their current majors until the
      # repository drops Node 18 from CI.
      - dependency-name: tsup
        versions: [">=9"]
      - dependency-name: vite
        versions: [">=8"]
