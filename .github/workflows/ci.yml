name: CI

on:
  # No paths filter on push: release.yml requires a push run of this workflow on
  # the tagged commit, and a docs-only commit (a changelog fix) must still get one.
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # vitest 5.1 supports node ^22.12 || ^24 (its engines field); node 18 and 20 are checked by runtime-smoke.
        node-version: [22, 24]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
        env:
          REDIS_URL: redis://localhost:6379
      # The coverage gate runs once on the newest node: vitest 5.x coverage
      # needs node:inspector/promises, which node 18 does not provide.
      - if: matrix.node-version == 22
        run: pnpm test:coverage
        env:
          REDIS_URL: redis://localhost:6379
      - if: matrix.node-version == 22
        name: Assert every publishable package produced a coverage report (the 100% gates live in each vitest.config.ts)
        run: |
          for pkg in core express fastify nestjs hono; do
            test -f "packages/$pkg/coverage/coverage-summary.json" || { echo "missing coverage report for $pkg"; exit 1; }
          done

  runtime-smoke:
    # The published packages support node >= 18 (>= 20 for @guardcore/fastify, like fastify v5; >= 20.19 for
    # @guardcore/nestjs, whose ESM-only NestJS 12 peer needs require() of ES modules): every built package must
    # load as ESM and as CJS on the oldest supported nodes, where the test runner itself cannot run.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Every package loads as ESM and as CJS
        run: |
          packages="core express hono"
          if [ "${{ matrix.node-version }}" != "18" ]; then packages="$packages fastify nestjs"; fi
          for pkg in $packages; do
            node -e "require('./packages/$pkg/dist/index.cjs')"
            node --input-type=module -e "await import('./packages/$pkg/dist/index.js')"
            echo "loaded @guardcore/$pkg on node ${{ matrix.node-version }}"
          done

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  conformance:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @guardcore/core exec vitest run tests/conformance
        env:
          REDIS_URL: redis://localhost:6379

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      # No cache: pnpm here; the job never runs an install, so the pnpm store
      # path does not exist and setup-node's post-step cache save fails the
      # job with a Path Validation Error.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm audit --audit-level=low

  ci:
    # The context master-rule requires: it reports on every run and fails when a job above failed or was
    # cancelled. A skipped job counts as passed.
    if: always()
    needs: [lint, test, runtime-smoke, build, conformance, dependency-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job above succeeded or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needs: $RESULTS"
          for result in $RESULTS; do
            case "$result" in failure|cancelled) exit 1 ;; esac
          done
