name: CI

on:
  push:
    branches: [master, main]
    paths:
      - 'packages/**'
      - 'conformance/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - 'tsconfig.base.json'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [master, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
        env:
          REDIS_URL: redis://localhost:6379
      # The coverage gate runs once on the newest node: vitest 5.x coverage
      # needs node:inspector/promises, which node 18 does not provide.
      - if: matrix.node-version == 22
        run: pnpm test:coverage
        env:
          REDIS_URL: redis://localhost:6379
      - if: matrix.node-version == 22
        name: Assert every publishable package produced a coverage report (the 100% gates live in each vitest.config.ts)
        run: |
          for pkg in core express fastify nestjs hono; do
            test -f "packages/$pkg/coverage/coverage-summary.json" || { echo "missing coverage report for $pkg"; exit 1; }
          done

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  conformance:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @guardcore/core exec vitest run tests/conformance
        env:
          REDIS_URL: redis://localhost:6379

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      # No cache: pnpm here; the job never runs an install, so the pnpm store
      # path does not exist and setup-node's post-step cache save fails the
      # job with a Path Validation Error.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm audit --audit-level=low
