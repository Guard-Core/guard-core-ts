name: Publish Containerized Demo

on:
  release:
    types: [created]
  push:
    branches:
      - master
    paths:
      - 'examples/**'
      - '.github/workflows/container-release.yml'
  workflow_dispatch:

jobs:
  publish-container:
    name: Build and push the containerized demo
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set version tag
        id: set_version
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "VERSION=${{ github.event.release.tag_name }}" >> "$GITHUB_ENV"
            echo "IS_RELEASE=true" >> "$GITHUB_ENV"
          else
            echo "VERSION=latest" >> "$GITHUB_ENV"
            echo "IS_RELEASE=false" >> "$GITHUB_ENV"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the demo image
        run: |
          docker compose -f examples/advanced/docker-compose.yml build advanced-app

      - name: Tag and push to GHCR
        run: |
          docker tag guard-core-ts-advanced-example:local ghcr.io/guard-core/guard-core-ts-example:latest
          docker push ghcr.io/guard-core/guard-core-ts-example:latest

          if [[ "${{ env.IS_RELEASE }}" == "true" ]]; then
            docker tag guard-core-ts-advanced-example:local ghcr.io/guard-core/guard-core-ts-example:${{ env.VERSION }}
            docker push ghcr.io/guard-core/guard-core-ts-example:${{ env.VERSION }}
          fi
