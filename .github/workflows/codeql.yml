name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  # One job for every language, so the required check context is exactly `codeql` (a matrix would suffix it
  # with the language).
  codeql:
    name: codeql
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.39.1
        with:
          languages: javascript-typescript,actions

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.39.1
        with:
          # The category of the earlier `analyze` job, so the existing analyses and alerts carry over.
          category: /language:javascript-typescript
