name: Bug report
description: Guard Core TS does not behave as documented
title: "[BUG] "
labels: [bug]
body:
  - type: input
    id: value
    attributes:
      label: Value this delivers
      description: One sentence a user could witness once this is fixed.
      placeholder: "Requests with whitelisted IPs are no longer rate limited."
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got. Error messages, stack traces and logs go here.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Configure Guard Core TS with '...'
        2. Send a request to '...'
        3. See error
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: "@guardcore/core version, adapter package and version, Node.js version, OS."
      placeholder: "@guardcore/core 4.4.0, @guardcore/express 4.4.0, Node.js 22, Ubuntu 24.04"
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: Your config with secrets masked.
      render: typescript
      placeholder: |
        // Minimal setup that reproduces the issue (secrets masked)
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Production or development, consistent or intermittent, workarounds tried.
